<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QVAS Remote Cab Audio</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #171717; color: #fff; }
    main { width: min(560px, calc(100vw - 32px)); padding: 24px; box-sizing: border-box; background: #292929; border: 1px solid #555; }
    h1 { margin: 0 0 20px; font-size: 1.5rem; }
    #status { min-height: 48px; padding: 12px; margin-bottom: 20px; background: #111; border-left: 4px solid #008040; box-sizing: border-box; }
    #enable-audio { width: 100%; margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; }
    input[type="range"] { width: 100%; }
    .controls { display: flex; gap: 12px; align-items: center; margin-top: 20px; }
    button { min-height: 48px; padding: 0 24px; border: 0; background: #008040; color: #fff; font-weight: 700; cursor: pointer; }
    button:active { background: #ff0000; }
    #volume-value { min-width: 48px; text-align: right; }
    .hint { color: #bbb; font-size: 0.85rem; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Remote Cab Audio</h1>
    <div id="status">Waiting for the HMI-C...</div>
    <button id="enable-audio" type="button">Enable Audio</button>
    <label for="volume">Cab volume <span id="volume-value">50%</span></label>
    <input id="volume" type="range" min="0" max="100" step="5" value="50">
    <div class="controls">
      <button id="stop" type="button">Stop</button>
    </div>
    <div class="hint">Keep this page open on the machine that should play the announcements.</div>
  </main>
  <script>
    const audio = new Audio();
    const status = document.getElementById('status');
    const volume = document.getElementById('volume');
    const volumeValue = document.getElementById('volume-value');
    let lastAnnouncementId = '';
    let lastState = null;
    let audioEnabled = false;

    function setVolume(value) {
      const percent = Math.max(0, Math.min(100, Number(value) || 0));
      audio.volume = percent / 100;
      volume.value = String(percent);
      volumeValue.textContent = `${percent}%`;
    }

    function stopAudio(message = 'Stopped') {
      audio.pause();
      audio.currentTime = 0;
      status.textContent = message;
    }

    async function playAnnouncement(announcement) {
      const announcementId = announcement.id || String(announcement.startedAt || Date.now());
      audio.pause();
      audio.currentTime = 0;
      audio.src = `/${encodeURI(announcement.audioPath)}?remote=${encodeURIComponent(announcementId)}`;
      status.textContent = announcement.text || announcement.type || 'Playing announcement';
      try {
        await audio.play();
        lastAnnouncementId = announcementId;
      } catch (error) {
        if (error.name === 'NotAllowedError') {
          audioEnabled = false;
          document.getElementById('enable-audio').hidden = false;
          status.textContent = 'Click Enable Audio before playback can start';
          return;
        }
        throw error;
      }
    }

    async function pollState() {
      try {
        const response = await fetch('/api/state', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const state = await response.json();
        lastState = state;
        if (Number.isFinite(Number(state.cabinVolume))) setVolume(state.cabinVolume);

        const announcement = state.announcement;
        if (!announcement || !announcement.audioPath) {
          if (!audio.paused || lastAnnouncementId) stopAudio('No announcement playing');
          lastAnnouncementId = '';
          return;
        }

        const announcementId = announcement.id || String(announcement.startedAt || Date.now());
        if (announcementId === lastAnnouncementId) return;
        if (!audioEnabled) {
          status.textContent = 'Click Enable Audio before playback can start';
          return;
        }
        await playAnnouncement(announcement);
      } catch (error) {
        status.textContent = `Connection unavailable: ${error.message}`;
      }
    }

    volume.addEventListener('input', () => setVolume(volume.value));
    document.getElementById('enable-audio').addEventListener('click', async () => {
      audioEnabled = true;
      document.getElementById('enable-audio').hidden = true;
      if (lastState?.announcement?.audioPath) {
        try {
          await playAnnouncement(lastState.announcement);
        } catch (error) {
          status.textContent = `Audio playback failed: ${error.message}`;
        }
      } else {
        status.textContent = 'Audio enabled. Waiting for announcement...';
      }
    });
    document.getElementById('stop').addEventListener('click', () => {
      stopAudio('Stopped locally');
      lastAnnouncementId = lastState?.announcement?.id || lastAnnouncementId;
    });
    audio.addEventListener('ended', () => { status.textContent = 'Ready'; });
    setVolume(volume.value);
    document.getElementById('enable-audio').hidden = false;
    pollState();
    setInterval(pollState, 250);
  </script>
</body>
</html>
