<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Announcement Audio Tool</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #111; color: #fff; font-weight: 700; }
    main { width: min(1100px, 100%); margin: 0 auto; padding: 24px; }
    h1 { margin: 0 0 18px; color: #ffff00; font-size: 1.5rem; }
    .toolbar, .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
    select, button { min-height: 42px; border: 1px solid #777; border-radius: 3px; background: #555; color: #fff; padding: 8px 12px; font: inherit; }
    button { cursor: pointer; background: #008040; }
    button.secondary { background: #555; }
    button:disabled { background: #444; color: #999; cursor: wait; }
    .file-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 12px; border: 1px solid #008040; background: #1b1b1b; margin-bottom: 12px; }
    input[type="file"] { max-width: 100%; }
    .route-list { max-height: 55vh; overflow: auto; border: 1px solid #008040; background: #050505; padding: 10px; }
    .line { margin-bottom: 12px; border-bottom: 1px solid #444; padding-bottom: 8px; }
    .line:last-child { border-bottom: 0; margin-bottom: 0; }
    .line-title { display: block; color: #ffff00; margin-bottom: 5px; }
    .run { display: inline-flex; align-items: center; margin: 4px 12px 4px 0; font-weight: 400; }
    .run input, .line-title input { margin-right: 5px; }
    .status { min-height: 24px; margin-top: 12px; color: #9f9; }
    .hint { color: #bbb; font-weight: 400; margin: 0 0 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Announcement Audio Tool</h1>
    <p class="hint">Upload one MP3 and automatically add or update it across selected manual routes.</p>
    <div class="toolbar">
      <select id="type" aria-label="Announcement type">
        <option value="form">Form</option>
        <option value="tns">TNS / Next station</option>
        <option value="naa">NAA / Now arriving</option>
        <option value="mtg">MTG / Mind the gap</option>
      </select>
      <select id="station" aria-label="Station" disabled>
        <option value="">Select station</option>
      </select>
    </div>
    <div class="file-row">
      <input id="file" type="file" accept="audio/mpeg,.mp3">
      <span id="file-name">No file selected</span>
    </div>
    <div class="actions">
      <button id="select-all" type="button">Select all routes</button>
      <button id="clear-all" class="secondary" type="button">Clear routes</button>
      <button id="apply" type="button">Apply selected routes</button>
    </div>
    <div id="routes" class="route-list">Loading routes...</div>
    <div id="status" class="status">Choose an MP3 and routes.</div>
  </main>
  <script>
    const state = { database: null, file: null };
    const routesElement = document.getElementById('routes');
    const statusElement = document.getElementById('status');

    function renderRoutes() {
      routesElement.replaceChildren();
      (state.database?.routes || []).forEach((line, lineIndex) => {
        const lineElement = document.createElement('section');
        lineElement.className = 'line';
        const lineLabel = document.createElement('label');
        lineLabel.className = 'line-title';
        const lineCheckbox = document.createElement('input');
        lineCheckbox.type = 'checkbox';
        lineLabel.append(lineCheckbox, document.createTextNode(line.name || `Line ${lineIndex + 1}`));
        lineElement.appendChild(lineLabel);
        const routes = Array.isArray(line.runs) ? line.runs : [];
        routes.forEach((route, routeIndex) => {
          const label = document.createElement('label');
          label.className = 'run';
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.dataset.line = lineIndex;
          checkbox.dataset.route = routeIndex;
          label.append(checkbox, document.createTextNode(route.name || 'Unnamed route'));
          lineElement.appendChild(label);
        });
        lineCheckbox.addEventListener('change', () => {
          lineElement.querySelectorAll('.run input').forEach(input => { input.checked = lineCheckbox.checked; });
          updateStationOptions();
        });
        lineElement.querySelectorAll('.run input').forEach(input => input.addEventListener('change', updateStationOptions));
        routesElement.appendChild(lineElement);
      });
    }

    function selectedRoutes() {
      return [...routesElement.querySelectorAll('.run input:checked')].map(input => {
        const line = state.database.routes[Number(input.dataset.line)];
        return line.runs[Number(input.dataset.route)];
      });
    }

    function updateStationOptions() {
      const stationSelect = document.getElementById('station');
      const announcementType = document.getElementById('type').value;
      const previousStation = stationSelect.value;
      const names = new Set();
      selectedRoutes().forEach(route => (route.stations || []).forEach(station => names.add(station)));
      stationSelect.replaceChildren(new Option('Select station', ''));
      [...names].sort().forEach(name => stationSelect.appendChild(new Option(name, name)));
      stationSelect.disabled = announcementType === 'form' || names.size === 0;
      if (names.has(previousStation)) stationSelect.value = previousStation;
    }

    function destinationPaths(route, announcementType) {
      const folder = `QR_PIDS_AudioFiles/Route Audio Files/${route.name}`;
      if (announcementType === 'form') return [`${folder}/Form.mp3`];
      const station = document.getElementById('station').value;
      return (route.stations || []).filter(name => name === station).map(station => {
        const filename = announcementType === 'tns'
          ? `TNS_${station}.mp3`
          : announcementType === 'naa'
            ? `${station}.mp3`
            : `${station} MTG.mp3`;
        return `${folder}/${filename}`;
      });
    }

    document.getElementById('file').addEventListener('change', event => {
      state.file = event.target.files[0] || null;
      document.getElementById('file-name').textContent = state.file ? state.file.name : 'No file selected';
    });
    document.getElementById('select-all').addEventListener('click', () => {
      routesElement.querySelectorAll('input').forEach(input => { input.checked = true; });
      updateStationOptions();
    });
    document.getElementById('clear-all').addEventListener('click', () => {
      routesElement.querySelectorAll('input').forEach(input => { input.checked = false; });
      updateStationOptions();
    });
    document.getElementById('type').addEventListener('change', updateStationOptions);
    document.getElementById('apply').addEventListener('click', async () => {
      const routes = selectedRoutes();
      const announcementType = document.getElementById('type').value;
      const station = document.getElementById('station').value;
      if (!state.file || state.file.type !== 'audio/mpeg' || !routes.length || (announcementType !== 'form' && !station)) {
        console.warn('[Announcement Tool] Choose an MP3 and at least one route.');
        statusElement.textContent = announcementType === 'form'
          ? 'Choose an MP3 and at least one route.'
          : 'Choose an MP3, station, and at least one route.';
        return;
      }
      console.group('[Announcement Tool] Applying audio');
      console.log('Announcement type:', announcementType);
      console.log('Station:', station || '(route-level Form)');
      console.log('File:', state.file.name, `${(state.file.size / 1024 / 1024).toFixed(2)} MB`);
      console.log('Selected routes:', routes.map(route => route.name));
      console.group('Destination paths');
      routes.forEach(route => console.log(route.name, destinationPaths(route, announcementType)));
      console.groupEnd();
      const applyButton = document.getElementById('apply');
      applyButton.disabled = true;
      statusElement.textContent = 'Applying...';
      try {
        const audioBase64 = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
          reader.onerror = reject;
          reader.readAsDataURL(state.file);
        });
        const response = await fetch('/api/custom-announcements', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ audioBase64, announcementType, station, routes })
        });
        const result = await response.json();
        if (!response.ok || !result.success) throw new Error(result.message || 'Upload failed.');
        console.log('Upload result:', result);
        statusElement.textContent = `${result.copied} added, ${result.overwritten} replaced, ${result.skipped} skipped across ${result.routes} route(s).`;
      } catch (error) {
        console.error('[Announcement Tool] Upload failed:', error);
        statusElement.textContent = error.message || 'Upload failed.';
      } finally {
        applyButton.disabled = false;
        console.groupEnd();
      }
    });

    fetch('/manual-routes.json')
      .then(response => response.json())
      .then(database => { state.database = database; renderRoutes(); updateStationOptions(); })
      .catch(error => { routesElement.textContent = 'Could not load manual routes.'; statusElement.textContent = error.message; });
  </script>
</body>
</html>
