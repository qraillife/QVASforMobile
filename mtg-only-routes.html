<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MTG-only Routes</title>
  <style>
    :root { font-family: Arial, sans-serif; color: #fff; background: #111; }
    body { max-width: 760px; margin: 0 auto; padding: 24px; }
    h1 { color: #ff0; }
    section { padding: 18px; margin: 16px 0; background: #222; border: 1px solid #555; }
    label { display: block; margin-bottom: 6px; font-weight: bold; }
    input, button { box-sizing: border-box; font: inherit; }
    input { width: 100%; padding: 10px; color: #fff; background: #111; border: 1px solid #777; text-transform: uppercase; }
    button { padding: 10px 16px; margin: 12px 8px 0 0; color: #fff; background: #2e5b2d; border: 0; cursor: pointer; font-weight: bold; }
    button.delete { background: #990000; margin: 0; }
    li { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #444; }
    #message { min-height: 20px; color: #8f8; }
    .hint { color: #bbb; line-height: 1.45; }
  </style>
</head>
<body>
  <h1>MTG-only Routes</h1>
  <p class="hint">Add GTFS route codes such as BRFG or BNFG. For these routes, Manual mode will remove Now Arriving at and use the station MTG audio from QR_PIDS_AudioFiles/Stations.</p>
  <section>
    <label for="route-code">GTFS route code</label>
    <input id="route-code" maxlength="12" placeholder="BRFG" autocomplete="off">
    <button id="add-route" type="button">Add route</button>
  </section>
  <section>
    <h2>Configured routes</h2>
    <ul id="routes"></ul>
  </section>
  <div id="message" role="status"></div>
  <script>
    let data = { routes: [] };
    const routeInput = document.getElementById('route-code');
    const routesElement = document.getElementById('routes');
    const messageElement = document.getElementById('message');

    async function load() {
      const response = await fetch('/mtg-only-routes.json');
      if (!response.ok) throw new Error(`Configuration unavailable (${response.status})`);
      data = await response.json();
      data.routes = [...new Set((Array.isArray(data.routes) ? data.routes : []).map(normalizeCode).filter(Boolean))].sort();
      render();
    }

    function normalizeCode(value) {
      return String(value || '').trim().toUpperCase();
    }

    function render() {
      routesElement.innerHTML = '';
      if (!data.routes.length) {
        routesElement.innerHTML = '<li>No MTG-only routes configured.</li>';
        return;
      }
      data.routes.forEach((route, index) => {
        const item = document.createElement('li');
        const label = document.createElement('span');
        label.textContent = route;
        const button = document.createElement('button');
        button.className = 'delete';
        button.textContent = 'Remove';
        button.onclick = () => { data.routes.splice(index, 1); render(); save(); };
        item.append(label, button);
        routesElement.appendChild(item);
      });
    }

    async function save(showMessage = true) {
      const response = await fetch('/api/mtg-only-routes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ routes: data.routes })
      });
      const result = await response.json();
      if (showMessage) messageElement.textContent = result.success ? 'Saved.' : result.message;
    }

    document.getElementById('add-route').onclick = () => {
      const code = normalizeCode(routeInput.value);
      if (!code || data.routes.includes(code)) return;
      data.routes.push(code);
      data.routes.sort();
      routeInput.value = '';
      render();
      save();
    };

    routeInput.addEventListener('keydown', event => {
      if (event.key === 'Enter') document.getElementById('add-route').click();
    });

    load().catch(error => messageElement.textContent = error.message);
  </script>
</body>
</html>
